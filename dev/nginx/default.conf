# nginx config for the "serve the dashboard from its own container" step.
#
# The page is served as static files; /api/* is reverse-proxied to the API
# container. "api" is the docker network alias of the API container - it is
# resolved by docker's embedded DNS inside the monitor-net network.
#
# Note the proxy_pass WITHOUT a trailing slash: the full URI (/api/status)
# must reach the backend unchanged.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 404;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
